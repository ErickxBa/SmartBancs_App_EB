version: '3.9'

services:
  # 1. Motor de Persistencia Relacional (Transaccional)
  postgres:
    image: postgres:16-alpine
    container_name: smartbancs_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartbancs_net

  # 2. Caché de Lectura (Redis)
  redis:
    image: redis:7-alpine
    container_name: smartbancs_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - smartbancs_net

  # 3. Bus de Mensajería para Desacoplamiento (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: smartbancs_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672" # Puerto de comunicación para los microservicios
      - "15672:15672" # Puerto de la Interfaz UI de administración
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartbancs_net

  # 4. API Transaccional (NestJS)
  transaction-api:
    build:
      context: ./apps/transaction-api
      dockerfile: Dockerfile
    container_name: smartbancs_api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - smartbancs_net

  # 5. AI Worker (Microservicio Python)
  ai-worker:
    build: ./services/ai-worker
    container_name: smartbancs_ai_worker
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - smartbancs_net

  sync-worker:
    build: ./services/sync-worker
    container_name: smartbancs_sync_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartbancs_net

  # 6. Observabilidad: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: smartbancs_prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - smartbancs_net

  # 7. Observabilidad: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: smartbancs_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/smartbancs.json
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/dashboards:/etc/grafana/dashboards
    networks:
      - smartbancs_net

  # 8. Servidor Web (Frontend)
  frontend:
    image: nginx:alpine
    container_name: smartbancs_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - smartbancs_net

networks:
  smartbancs_net:
    driver: bridge
